[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec_sim"
version = "0.1.0"
description = "Monte Carlo simulation of multi-round quantum error correction under circuit-level noise, decoded with relay_bp."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools]
packages = ["qec_sim"]
